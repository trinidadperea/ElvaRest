<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - ElvaRest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/adminlte/css/adminlte.min.css}">
</head>
<body class="login-page bg-body-secondary">
  <div class="login-box">
    <div class="login-logo">
      <a th:href="@{/}"><b>Gestión de</b> Concursos</a>
    </div>
    <div class="card">
      <div class="card-body login-card-body">
        <p class="login-box-msg">Iniciá sesión para comenzar</p>

          <div class="alert alert-danger" th:if="${param.error}">
            Usuario o contraseña incorrectos.
          </div>

        <form method="post" th:action="@{/login}">
          <input type="hidden" th:if="${_csrf != null}"
                 th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="input-group mb-3">
            <input type="text" name="username" class="form-control" placeholder="Usuario" required autofocus>
            <div class="input-group-text"><span class="bi bi-person"></span></div>
          </div>
          <div class="input-group mb-3">
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            <div class="input-group-text"><span class="bi bi-lock-fill"></span></div>
          </div>
          <input type="hidden" name="next" th:value="${param.next}">
          <div class="row">
            <div class="col-12">
              <button type="submit" class="btn btn-primary d-grid w-100">Ingresar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script th:src="@{/adminlte/js/adminlte.min.js}"></script>
</body>
</html>
