{% extends "base.html" %}

{% block title %}Editar licencia{% endblock %}



{% block content_header %}

<div class="row">


    <div class="col-sm-6">


        <h3 class="mb-0">


            <i class="bi bi-pencil-square me-2"></i>


            Editar licencia



        </h3>


    </div>





    <div class="col-sm-6">


        <ol class="breadcrumb float-sm-end">


            <li class="breadcrumb-item">

                <a href="{% url 'core:index' %}">
                    Inicio
                </a>

            </li>




            <li class="breadcrumb-item">

                <a href="{% url 'licencias:lista' %}">
                    Licencias
                </a>

            </li>




            <li class="breadcrumb-item active">

                Editar

            </li>




        </ol>


    </div>


</div>


{% endblock %}









{% block content %}







<div class="row">



    <div class="col-md-8">





        <div class="card">





            <div class="card-header">


                <h5 class="mb-0">


                    <i class="bi bi-calendar-x me-2"></i>


                    Editar información de licencia



                </h5>



            </div>







            <div class="card-body">





                <form>







                    <!-- Docente -->

                    <div class="mb-3">


                        <label class="form-label">


                            Docente


                        </label>




                        <select class="form-select">


                            <option selected>


                                Ana Martínez


                            </option>


                            <option>


                                Carlos López


                            </option>


                            <option>


                                María González


                            </option>



                        </select>



                    </div>









                    <!-- Tipo -->

                    <div class="mb-3">


                        <label class="form-label">


                            Tipo de licencia


                        </label>




                        <select class="form-select">


                            <option selected>


                                Licencia médica


                            </option>


                            <option>


                                Licencia por estudio


                            </option>


                            <option>


                                Licencia personal


                            </option>



                        </select>



                    </div>









                    <!-- Desde -->

                    <div class="mb-3">


                        <label class="form-label">


                            Desde


                        </label>




                        <input 
                            type="date"
                            class="form-control"
                            value="2026-08-04"
                        >



                    </div>









                    <!-- Hasta -->

                    <div class="mb-3">


                        <label class="form-label">


                            Hasta


                        </label>




                        <input 
                            type="date"
                            class="form-control"
                            value="2026-08-10"
                        >



                    </div>









                    <!-- Estado -->

                    <div class="mb-3">


                        <label class="form-label">


                            Estado


                        </label>




                        <select class="form-select">


                            <option selected>


                                Aprobada


                            </option>


                            <option>


                                Pendiente


                            </option>


                            <option>


                                Rechazada


                            </option>



                        </select>



                    </div>









                    <div class="d-flex justify-content-between">





                        <a 
                            href="{% url 'licencias:lista' %}" 
                            class="btn btn-secondary"
                        >


                            <i class="bi bi-arrow-left"></i>


                            Cancelar



                        </a>







                        <button 
                            type="submit"
                            class="btn btn-primary"
                        >


                            <i class="bi bi-save"></i>


                            Guardar cambios



                        </button>






                    </div>








                </form>






            </div>







        </div>







    </div>





</div>








{% endblock %}
