{% extends "base.html" %}

{% block title %}Nuevo usuario{% endblock %}



{% block content_header %}

<div class="row">

    <div class="col-sm-6">

        <h3 class="mb-0">

            <i class="bi bi-person-plus me-2"></i>

            Nuevo usuario

        </h3>

    </div>



    <div class="col-sm-6">

        <ol class="breadcrumb float-sm-end">


            <li class="breadcrumb-item">

                <a href="{% url 'core:index' %}">
                    Inicio
                </a>

            </li>


            <li class="breadcrumb-item">

                <a href="{% url 'usuarios:lista' %}">
                    Usuarios
                </a>

            </li>


            <li class="breadcrumb-item active">

                Nuevo

            </li>


        </ol>

    </div>


</div>

{% endblock %}





{% block content %}



<div class="row mb-3">


    <div class="col">


        <a href="{% url 'usuarios:lista' %}" class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Volver

        </a>


    </div>


</div>





<div class="row justify-content-center">


    <div class="col-lg-8">



        <div class="card">



            <div class="card-header">


                <h5 class="mb-0">

                    <i class="bi bi-person me-2"></i>

                    Información del usuario

                </h5>


            </div>





            <div class="card-body">



                <form>



                    <div class="row">


                        <div class="col-md-6 mb-3">


                            <label class="form-label">

                                Nombre

                            </label>


                            <input 
                                type="text"
                                class="form-control"
                                placeholder="Ingrese el nombre"
                            >


                        </div>




                        <div class="col-md-6 mb-3">


                            <label class="form-label">

                                Apellido

                            </label>


                            <input 
                                type="text"
                                class="form-control"
                                placeholder="Ingrese el apellido"
                            >


                        </div>



                    </div>





                    <div class="row">


                        <div class="col-md-6 mb-3">


                            <label class="form-label">

                                Correo electrónico

                            </label>


                            <input 
                                type="email"
                                class="form-control"
                                placeholder="ejemplo@correo.com"
                            >


                        </div>





                        <div class="col-md-6 mb-3">


                            <label class="form-label">

                                Usuario

                            </label>


                            <input 
                                type="text"
                                class="form-control"
                                placeholder="Nombre de usuario"
                            >


                        </div>



                    </div>





                    <div class="row">


                        <div class="col-md-6 mb-3">


                            <label class="form-label">

                                Contraseña

                            </label>


                            <input 
                                type="password"
                                class="form-control"
                                placeholder="Ingrese contraseña"
                            >


                        </div>





                        <div class="col-md-6 mb-3">


                            <label class="form-label">

                                Confirmar contraseña

                            </label>


                            <input 
                                type="password"
                                class="form-control"
                                placeholder="Repita contraseña"
                            >


                        </div>



                    </div>






                    <div class="row">


                        <div class="col-md-6 mb-3">


                            <label class="form-label">

                                Rol

                            </label>



                            <select class="form-select">


                                <option selected disabled>

                                    Seleccionar rol

                                </option>


                                <option>

                                    Administrador

                                </option>


                                <option>

                                    Docente

                                </option>


                                <option>

                                    Usuario

                                </option>



                            </select>


                        </div>





                        <div class="col-md-6 mb-3">


                            <label class="form-label">

                                Estado

                            </label>



                            <select class="form-select">


                                <option selected>

                                    Activo

                                </option>


                                <option>

                                    Inactivo

                                </option>



                            </select>


                        </div>



                    </div>







                    <div class="text-end mt-3">



                        <button 
                            type="button"
                            class="btn btn-secondary"
                        >

                            <i class="bi bi-x-circle"></i>

                            Cancelar

                        </button>





                        <button 
                            type="submit"
                            class="btn btn-success"
                        >

                            <i class="bi bi-person-plus"></i>

                            Crear usuario

                        </button>



                    </div>




                </form>



            </div>



        </div>




    </div>



</div>




{% endblock %}
