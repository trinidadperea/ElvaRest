{% extends "base.html" %}

{% block title %}Editar docente{% endblock %}

{% block content_header %}
<div class="row">
    <div class="col-sm-6">
        <h3 class="mb-0">
            <i class="bi bi-pencil-square me-2"></i>
            Editar docente
        </h3>
    </div>

    <div class="col-sm-6">
        <ol class="breadcrumb float-sm-end">
            <li class="breadcrumb-item">
                <a href="{% url 'core:index' %}">Inicio</a>
            </li>
            <li class="breadcrumb-item">
                <a href="{% url 'docentes:lista' %}">Docentes</a>
            </li>
            <li class="breadcrumb-item active">
                Editar
            </li>
        </ol>
    </div>
</div>
{% endblock %}

{% block content %}

<form>

<div class="card">

    <div class="card-header">
        <h3 class="card-title">
            <i class="bi bi-person me-2"></i>
            Datos personales
        </h3>
    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" value="María">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control" value="González">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">DNI</label>
                <input type="text" class="form-control" value="32145678">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">CUIL</label>
                <input type="text" class="form-control" value="27-32145678-4">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control" value="1986-08-15">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Sexo</label>
                <select class="form-select">
                    <option>Femenino</option>
                    <option>Masculino</option>
                    <option>Otro</option>
                </select>
            </div>

        </div>

    </div>

</div>

<div class="card">

    <div class="card-header">
        <h3 class="card-title">
            <i class="bi bi-envelope me-2"></i>
            Información de contacto
        </h3>
    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" value="mgonzalez@colegio.edu">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" class="form-control" value="2615551234">
            </div>

            <div class="col-12 mb-3">
                <label class="form-label">Dirección</label>
                <input type="text" class="form-control" value="Av. San Martín 1234, Mendoza">
            </div>

        </div>

    </div>

</div>

<div class="card">

    <div class="card-header">
        <h3 class="card-title">
            <i class="bi bi-briefcase me-2"></i>
            Información laboral
        </h3>
    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Cargo</label>
                <input type="text" class="form-control" value="Profesor">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Título</label>
                <input type="text" class="form-control" value="Profesor de Matemática">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Fecha de ingreso</label>
                <input type="date" class="form-control" value="2018-03-01">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Estado</label>
                <select class="form-select">
                    <option selected>Activo</option>
                    <option>Inactivo</option>
                </select>
            </div>

        </div>

    </div>

</div>

<div class="card">

    <div class="card-body d-flex justify-content-between">

        <a href="{% url 'docentes:lista' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i>
            Volver
        </a>

        <div>

            <button type="reset" class="btn btn-outline-secondary">
                Cancelar
            </button>

            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i>
                Guardar cambios
            </button>

        </div>

    </div>

</div>

</form>

{% endblock %}
