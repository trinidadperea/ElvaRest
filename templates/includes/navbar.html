{% load static %}
<nav class="app-header navbar navbar-expand bg-body">
  <div class="container-fluid">
    <!-- Toggle sidebar -->
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Toggle sidebar">
          <i class="bi bi-list"></i>
        </a>
      </li>
    </ul>

    <!-- Links derecha -->
    <ul class="navbar-nav ms-auto">

      <!-- Modo claro/oscuro -->
      <li class="nav-item dropdown">
        <a class="nav-link" href="#" id="bd-theme" data-bs-toggle="dropdown" aria-label="Cambiar tema">
          <i class="bi bi-sun-fill" data-lte-theme-icon="light"></i>
          <i class="bi bi-moon-fill d-none" data-lte-theme-icon="dark"></i>
          <i class="bi bi-circle-half d-none" data-lte-theme-icon="auto"></i>
        </a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bd-theme">
          <li><button type="button" class="dropdown-item" data-bs-theme-value="light"><i class="bi bi-sun-fill me-2"></i>Claro</button></li>
          <li><button type="button" class="dropdown-item" data-bs-theme-value="dark"><i class="bi bi-moon-fill me-2"></i>Oscuro</button></li>
          <li><button type="button" class="dropdown-item active" data-bs-theme-value="auto"><i class="bi bi-circle-half me-2"></i>Auto</button></li>
        </ul>
      </li>

      <!-- Usuario -->
      <li class="nav-item dropdown user-menu">
        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle fs-4"></i>
          <span class="d-none d-md-inline ms-1">{{ request.user.get_full_name|default:request.user.username }}</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
          <li class="user-header text-bg-primary">
            <i class="bi bi-person-circle" style="font-size: 3rem;"></i>
            <p>
              {{ request.user.get_full_name|default:request.user.username }}
              <small>{{ request.user.email }}</small>
            </p>
          </li>
          <li class="user-footer">
            <a href="#" class="btn btn-outline-secondary">Perfil</a>
            <form method="post" action="{% url 'logout' %}" class="d-inline float-end">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-danger">Salir</button>
            </form>
          </li>
        </ul>
      </li>
    </ul>
  </div>
</nav>
