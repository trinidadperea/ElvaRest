<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Detalle de alerta', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 data-subtitle="Aviso institucional">Detalle del aviso</h3>
</section>
<section id="contenido">


  <article class="school-alert-detail"
           th:classappend="${item.prioridad == T(com.elvarest.cliente.dto.enums.PrioridadAlerta).ALTA ? ' school-alert-high' : ' school-alert-medium'}">
    <div class="school-alert-icon" aria-hidden="true">
      <i th:class="${item.prioridad == T(com.elvarest.cliente.dto.enums.PrioridadAlerta).ALTA ? 'bi bi-exclamation-triangle-fill' : 'bi bi-info-circle-fill'}"></i>
    </div>
    <div class="school-alert-content">
      <div class="school-alert-meta">
        <span class="badge rounded-pill"
              th:classappend="${item.prioridad == T(com.elvarest.cliente.dto.enums.PrioridadAlerta).ALTA ? ' badge-priority-high' : ' badge-priority-medium'}"
              th:text="${item.prioridad == T(com.elvarest.cliente.dto.enums.PrioridadAlerta).ALTA ? 'Prioridad alta' : 'Prioridad media'}"></span>
        <span class="badge rounded-pill"
              th:classappend="${item.leida ? ' badge-alert-read' : ' badge-alert-unread'}"
              th:text="${item.leida ? 'Leída' : 'Pendiente de lectura'}"></span>
      </div>
      <p class="school-alert-detail-message" th:text="${item.mensaje}"></p>
      <p class="school-alert-date mb-0">
        <i class="bi bi-calendar3 me-1"></i>Emitida el
        <time th:if="${item.fechaEmision != null}" th:text="${#temporals.format(item.fechaEmision, 'dd/MM/yyyy')}"></time>
        <span th:if="${item.fechaEmision == null}">Sin fecha registrada</span>
      </p>
    </div>
  </article>

  <div class="d-flex flex-wrap gap-2 mt-3">
    <a class="btn btn-outline-secondary" th:href="@{/alertas}">
      <i class="bi bi-arrow-left me-1"></i>Volver a alertas
    </a>
    <a class="btn btn-outline-primary" th:href="@{/alertas/{id}/editar(id=${item.id})}">
      <i class="bi bi-pencil me-1"></i>Editar aviso
    </a>
    <form th:if="${!item.leida}" method="post" th:action="@{/alertas/{id}/marcar-leida(id=${item.id})}"
          class="inline-action-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="btn btn-primary" type="submit">
        <i class="bi bi-check2-circle me-1"></i>Marcar como leída / resuelta
      </button>
    </form>
    <span class="align-self-center text-success" th:if="${item.leida}">
      <i class="bi bi-check2-circle me-1"></i>Alerta resuelta
    </span>
  </div>

</section>
</html>
