<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Editar alerta', ~{::#encabezado}, ~{::#contenido})}">
<section id="encabezado"><h3>Editar alerta</h3></section>
<section id="contenido">
  <form method="post" th:action="@{/alertas/actualizar}" th:object="${item}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3"><label>Mensaje</label><textarea class="form-control" th:field="*{mensaje}" required></textarea></div>
    <div class="mb-3"><label>Fecha de emision</label><input class="form-control" type="date" th:field="*{fechaEmision}" required></div>
    <div class="mb-3"><label>Prioridad</label><select class="form-select" th:field="*{prioridad}" required><option th:each="value : ${T(com.elvarest.cliente.dto.enums.PrioridadAlerta).values()}" th:value="${value}" th:text="${value}"></option></select></div>
    <label class="form-check"><input class="form-check-input" type="checkbox" th:field="*{leida}"> Leida</label>
    <div class="mt-3"><a class="btn btn-secondary" th:href="@{/alertas}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar</button></div>
  </form>
</section>
</html>
