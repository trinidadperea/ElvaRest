<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Editar alerta', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 data-subtitle="Modifique el aviso o su estado de lectura">Editar alerta</h3>
</section>
<section id="contenido">


  <form method="post" th:action="@{/alertas/actualizar}" th:object="${item}" data-loading>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
      <label for="mensaje">Mensaje *</label>
      <textarea class="form-control" id="mensaje" rows="4" th:field="*{mensaje}" required></textarea>
    </div>
    <div class="mb-3">
      <label for="fechaEmision">Fecha de emisión *</label>
      <input class="form-control" id="fechaEmision" type="date" th:field="*{fechaEmision}" required>
    </div>
    <div class="mb-3">
      <label for="prioridad">Prioridad *</label>
      <select class="form-select" id="prioridad" th:field="*{prioridad}" required>
        <option th:each="value : ${T(com.elvarest.cliente.dto.enums.PrioridadAlerta).values()}"
                th:value="${value}"
                th:text="${value == T(com.elvarest.cliente.dto.enums.PrioridadAlerta).ALTA ? 'Alta' : 'Media'}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label>Estado</label>
      <div class="pt-1">
        <label class="form-check mb-0">
          <input class="form-check-input" type="checkbox" th:field="*{leida}">
          Marcar como leída / resuelta
        </label>
      </div>
    </div>

    <div class="mt-4 pt-2 border-top d-flex justify-content-end gap-2">
      <a class="btn btn-outline-secondary" th:href="@{/alertas}">Cancelar</a>
      <button class="btn btn-primary" type="submit">
        <i class="bi bi-check-lg me-1"></i>Guardar cambios
      </button>
    </div>
  </form>

</section>
</html>
