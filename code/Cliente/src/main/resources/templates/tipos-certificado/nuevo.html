<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Tipo de certificado', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
    <h3 th:text="${item.id == null ? 'Nuevo tipo de certificado' : 'Editar tipo de certificado'}">Tipo de certificado</h3>
</section>
<section id="contenido">
    <form method="post" th:action="@{/tipos-certificado/actualizar}" th:object="${item}" data-loading>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="codigo">Código</label>
            <!-- readonly (no disabled) para que se envíe: el Servidor no permite cambiarlo. -->
            <input class="form-control" id="codigo" th:field="*{codigo}" required
                   th:readonly="${item.id != null}" placeholder="Ej.: APTO_PSICOFISICO">
        </div>
        <div class="mb-3">
            <label for="nombre">Nombre</label>
            <input class="form-control" id="nombre" th:field="*{nombre}" required th:disabled="${isDisabled}">
        </div>
        <div class="mb-3">
            <label class="form-check mb-0">
                <input class="form-check-input" type="checkbox" th:field="*{obligatorio}" th:disabled="${isDisabled}">
                Obligatorio para aprobar el paso 2 del concurso
            </label>
        </div>
        <div class="mb-3">
            <label class="form-check mb-0">
                <input class="form-check-input" type="checkbox" th:field="*{permiteProvisorio}" th:disabled="${isDisabled}">
                Puede ser provisorio (con fecha de vencimiento)
            </label>
        </div>

        <div class="d-flex flex-wrap gap-2 mt-3">
            <a class="btn btn-outline-secondary" th:href="@{/tipos-certificado/list}">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
            <button type="submit" class="btn btn-primary" th:if="${!isDisabled}">
                <i class="bi bi-check-lg me-1"></i>Guardar
            </button>
        </div>
    </form>
</section>
</html>
