<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Detalle del certificado', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
    <h3 th:attr="data-subtitle=${item.tipoCertificado != null ? 'Tipo: ' + item.tipoCertificado.nombre : 'Certificado sin tipo asignado'}">
    <span th:text="${item.concursoDocente != null and item.concursoDocente.docente != null
                     ? item.concursoDocente.docente.apellido + ', ' + item.concursoDocente.docente.nombre : 'Certificado'}"></span></h3>
</section>
<section id="contenido">
    <div class="card" th:with="postulacion=${item.concursoDocente}">
        <div class="card-header d-flex align-items-center gap-2">
            <h3 class="card-title mb-0">Datos del certificado</h3>
            <span class="badge rounded-pill ms-auto" th:classappend="${item.actual ? 'text-bg-primary' : 'text-bg-secondary'}"
                  th:text="${item.actual ? 'Actual' : 'Reemplazado (historial)'}"></span>
        </div>
        <div class="card-body">
            <div class="detail-grid">
                <div class="detail-item">
                    <dt>Docente</dt>
                    <dd>
                        <a class="text-decoration-none fw-semibold" th:if="${postulacion != null and postulacion.docente != null}"
                           th:href="@{/docentes/{id}(id=${postulacion.docente.id})}"
                           th:text="${postulacion.docente.apellido + ', ' + postulacion.docente.nombre}"></a>
                    </dd>
                </div>
                <div class="detail-item">
                    <dt>Concurso</dt>
                    <dd>
                        <a class="text-decoration-none" th:if="${postulacion != null and postulacion.concurso != null}"
                           th:href="@{/concursos/{id}(id=${postulacion.concurso.id})}" th:text="${postulacion.concurso.descripcion}"></a>
                    </dd>
                </div>
                <div class="detail-item">
                    <dt>Tipo de certificado</dt>
                    <dd th:text="${item.tipoCertificado != null ? item.tipoCertificado.nombre : '—'}"></dd>
                </div>
                <div class="detail-item">
                    <dt>Carácter</dt>
                    <dd th:text="${item.caracter != null ? item.caracter.etiqueta : '—'}"></dd>
                </div>
                <div class="detail-item" th:if="${item.fechaVencimiento != null}">
                    <dt>Fecha de vencimiento</dt>
                    <dd>
                        <span th:text="${#temporals.format(item.fechaVencimiento, 'dd/MM/yyyy')}"></span>
                        <span class="badge rounded-pill text-bg-danger ms-1"
                              th:if="${item.actual and item.fechaVencimiento.isBefore(#temporals.createToday())}">Vencido</span>
                    </dd>
                </div>
                <div class="detail-item">
                    <dt>Cargado el</dt>
                    <dd th:text="${item.fechaCarga != null ? #temporals.format(item.fechaCarga, 'dd/MM/yyyy') : '—'}"></dd>
                </div>
            </div>
        </div>
    </div>

    <div class="list-toolbar">
        <div class="toolbar-filters">
            <a class="btn btn-outline-secondary" th:href="@{/certificados/list}">
                <i class="bi bi-arrow-left me-1"></i>Volver al listado
            </a>
        </div>
        <a class="btn btn-primary" th:if="${item.actual and item.concursoDocente != null and item.tipoCertificado != null}"
           th:href="@{/certificados/nuevo/postulacion/{pid}(pid=${item.concursoDocente.id}, tipo=${item.tipoCertificado.id})}">
            <i class="bi bi-arrow-repeat me-1"></i>Renovar
        </a>
    </div>
</section>
</html>
