<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Detalle del certificado', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 th:attr="data-subtitle=${item.tipoCertificado != null ? 'Tipo: ' + item.tipoCertificado.nombre : 'Certificado sin tipo asignado'}">
    <span th:text="${item.docente != null ? item.docente.apellido + ', ' + item.docente.nombre : 'Certificado'}"></span></h3>
</section>
<section id="contenido">


  <div class="card">
    <div class="card-header d-flex align-items-center gap-2">
      <h3 class="card-title mb-0">Datos del certificado</h3>
      <span class="badge rounded-pill ms-auto"
            th:classappend="${item.presentado ? 'text-bg-success' : 'text-bg-warning'}"
            th:text="${item.presentado ? 'Presentado' : 'No presentado'}"></span>
    </div>
    <div class="card-body">
      <div class="detail-grid">
        <div class="detail-item">
          <dt>Docente</dt>
          <dd>
            <a class="text-decoration-none fw-semibold" th:if="${item.docente != null}"
               th:href="@{/docentes/{id}(id=${item.docente.id})}"
               th:text="${item.docente.apellido + ', ' + item.docente.nombre}"></a>
            <span th:if="${item.docente == null}">—</span>
          </dd>
        </div>
        <div class="detail-item">
          <dt>Tipo de certificado</dt>
          <dd th:text="${item.tipoCertificado != null ? item.tipoCertificado.nombre : '—'}"></dd>
        </div>
        <div class="detail-item">
          <dt>Fecha de emisión</dt>
          <dd th:text="${item.fechaEmision != null ? #temporals.format(item.fechaEmision, 'dd/MM/yyyy') : '—'}"></dd>
        </div>
        <div class="detail-item" th:if="${item.fechaVencimiento != null}">
          <dt>Fecha de vencimiento</dt>
          <dd th:text="${#temporals.format(item.fechaVencimiento, 'dd/MM/yyyy')}"></dd>
        </div>
        <div class="detail-item">
          <dt>Requiere vencimiento</dt>
          <dd th:text="${item.requiereVencimiento ? 'Sí' : 'No'}"></dd>
        </div>
        <div class="detail-item">
          <dt>Presentado</dt>
          <dd th:text="${item.presentado ? 'Sí' : 'No'}"></dd>
        </div>
        <div class="detail-item" th:if="${item.tipoCertificado != null and item.tipoCertificado.mesesVigencia > 0}">
          <dt>Vigencia del tipo</dt>
          <dd th:text="${item.tipoCertificado.mesesVigencia} + ' mes(es)'"></dd>
        </div>
      </div>
    </div>
  </div>

  <div class="list-toolbar">
    <div class="toolbar-filters">
      <a class="btn btn-outline-secondary" th:href="@{/certificados/list}">
        <i class="bi bi-arrow-left me-1"></i>Volver al listado
      </a>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-outline-danger" th:href="@{/certificados/baja/{id}(id=${item.id})}"
         th:attr="data-confirm='¿Dar de baja este certificado?'">
        <i class="bi bi-trash me-1"></i>Eliminar
      </a>
      <a class="btn btn-primary" th:href="@{/certificados/{id}/editar(id=${item.id})}">
        <i class="bi bi-pencil me-1"></i>Editar certificado
      </a>
    </div>
  </div>

</section>
</html>
