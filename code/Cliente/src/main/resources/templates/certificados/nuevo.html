<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Cargar certificado', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
    <h3 th:attr="data-subtitle=${postulacion.concurso != null ? 'Concurso: ' + postulacion.concurso.descripcion : 'Postulación sin concurso'}">
        <span th:text="${postulacion.docente != null ? 'Certificados de ' + postulacion.docente.apellido + ', ' + postulacion.docente.nombre : 'Certificados'}"></span>
    </h3>
</section>
<section id="contenido">

    <div class="card">
        <div class="card-header"><h3 class="card-title mb-0">Certificados de este concurso</h3></div>
        <div class="card-body">
            <th:block th:if="${!certificados.isEmpty()}">
                <div th:replace="~{certificados/fragmentos :: tabla(${certificados})}"></div>
            </th:block>
            <p class="text-secondary mb-0" th:if="${certificados.isEmpty()}">Todavía no se cargó ningún certificado.</p>
        </div>
    </div>

    <div class="card">
        <div class="card-header"><h3 class="card-title mb-0">Cargar / renovar certificado</h3></div>
        <div class="card-body">
            <p class="text-secondary small">Si ya existe un certificado de ese tipo, el nuevo lo reemplaza y el anterior queda en el historial.</p>
            <form th:replace="~{certificados/fragmentos :: carga(${postulacion.id}, 'docente')}"></form>
        </div>
    </div>

    <a class="btn btn-outline-secondary" th:if="${postulacion.docente != null}"
       th:href="@{/docentes/{id}(id=${postulacion.docente.id})}">
        <i class="bi bi-arrow-left me-1"></i>Volver al docente
    </a>
</section>
</html>
