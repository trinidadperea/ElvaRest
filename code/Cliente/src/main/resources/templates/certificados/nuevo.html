<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Nuevo certificado', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 data-subtitle="Registro de un certificado para un docente">Nuevo certificado</h3>
</section>
<section id="contenido">


  <form method="post" th:action="@{/certificados/actualizar}" th:object="${item}" data-loading>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div class="mb-3">
      <label for="docente">Docente</label>
      <select class="form-select" id="docente" th:field="*{docente.id}" required>
        <option value="">Seleccione un docente</option>
        <option th:each="docente : ${docentes}" th:value="${docente.id}"
                th:text="${docente.apellido + ', ' + docente.nombre}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label for="tipoCertificado">Tipo de certificado</label>
      <select class="form-select" id="tipoCertificado" th:field="*{tipoCertificado.id}" required>
        <option value="">Seleccione un tipo</option>
        <option th:each="tipo : ${tiposCertificado}" th:value="${tipo.id}"
                th:text="${tipo.nombre}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label for="fechaEmision">Fecha de emisión</label>
      <input class="form-control" id="fechaEmision" type="date" th:field="*{fechaEmision}" required>
    </div>
    <div class="mb-3">
      <label class="form-check mb-0">
        <input class="form-check-input" type="checkbox" th:field="*{requiereVencimiento}">
        Requiere vencimiento
      </label>
      <div class="form-text">Indique si el certificado tiene fecha de vencimiento según su tipo.</div>
    </div>
    <div class="mb-3">
      <label for="fechaVencimiento">Fecha de vencimiento</label>
      <input class="form-control" id="fechaVencimiento" type="date" th:field="*{fechaVencimiento}"
             th:required="${item.requiereVencimiento}">
      <div class="form-text">Complete solo si el certificado requiere vencimiento.</div>
    </div>
    <div class="mb-3">
      <label class="form-check mb-0">
        <input class="form-check-input" type="checkbox" th:field="*{presentado}">
        Presentado
      </label>
      <div class="form-text">Marque si el docente ya presentó el certificado.</div>
    </div>

    <div class="d-flex flex-wrap gap-2 mt-3">
      <a class="btn btn-outline-secondary" th:href="@{/certificados/list}">
        <i class="bi bi-arrow-left me-1"></i>Cancelar
      </a>
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-lg me-1"></i>Guardar certificado
      </button>
    </div>
  </form>

  <script>
    (function () {
      var requiere = document.getElementById('requiereVencimiento');
      var vencimiento = document.getElementById('fechaVencimiento');
      if (!requiere || !vencimiento) { return; }

      var sincronizar = function () {
        vencimiento.required = requiere.checked;
        if (!requiere.checked) {
          vencimiento.value = '';
        }
      };
      requiere.addEventListener('change', sincronizar);
      sincronizar();
    })();
  </script>
</section>
</html>
