<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Editar materia', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 th:attr="data-subtitle=${'Materia: ' + item.nombre}">Editar materia</h3>
</section>
<section id="contenido">


  <form method="post" th:action="@{/materias/actualizar}" th:object="${item}" data-loading>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
      <label for="nombre">Nombre</label>
      <input class="form-control" id="nombre" th:field="*{nombre}" required>
      <div class="form-text">Nombre de la materia (por ejemplo: Matemática).</div>
    </div>
    <div class="mb-3">
      <label for="area">Área</label>
      <input class="form-control" id="area" th:field="*{area}" required>
      <div class="form-text">Área a la que pertenece la materia (por ejemplo: Ciencias Exactas).</div>
    </div>
    <div class="mb-3">
      <label for="curso">Curso</label>
      <select class="form-select" id="curso" name="curso.id">
        <option value="">Sin curso asignado</option>
        <option th:each="curso : ${cursos}" th:value="${curso.id}"
                th:selected="${item.curso != null and item.curso.id == curso.id}"
                th:text="${curso.anio + '° Año'}"></option>
      </select>
      <div class="form-text">Curso al que pertenece la materia.</div>
    </div>

    <div class="d-flex flex-wrap gap-2 mt-3">
      <a class="btn btn-outline-secondary" th:href="@{/materias/list}">
        <i class="bi bi-arrow-left me-1"></i>Cancelar
      </a>
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-lg me-1"></i>Guardar cambios
      </button>
    </div>
  </form>

</section>
</html>
