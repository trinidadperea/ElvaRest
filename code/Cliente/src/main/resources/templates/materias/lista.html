<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Materias', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 data-subtitle="Materias registradas en la institución">Materias</h3>
</section>
<section id="contenido">


  <div class="list-toolbar">
    <div class="toolbar-search">
      <input class="form-control" type="search" data-filter-input="#tablaMaterias"
             placeholder="Buscar por nombre o área…" aria-label="Buscar materias">
    </div>
    <div class="toolbar-filters">
      <a class="btn btn-primary" th:href="@{/materias/nuevo}">
        <i class="bi bi-plus-lg me-1"></i>Nueva materia
      </a>
    </div>
  </div>

  <div class="table-responsive" th:if="${!items.isEmpty()}">
    <table class="table" id="tablaMaterias">
      <thead>
      <tr>
        <th>Materia</th>
        <th>Área</th>
        <th>Curso</th>
        <th class="text-end">Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${items}">
        <td>
          <a class="fw-semibold text-decoration-none" th:href="@{/materias/{id}(id=${item.id})}"
             th:text="${item.nombre != null and !item.nombre.isBlank() ? item.nombre : 'Materia sin nombre'}"></a>
        </td>
        <td th:text="${item.area != null and !item.area.isBlank() ? item.area : '—'}"></td>
        <td>
          <span class="badge rounded-pill text-bg-secondary"
                th:text="${item.curso != null ? item.curso.anio + '° Año' : 'Sin curso'}"></span>
        </td>
        <td>
          <div class="table-actions">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/materias/{id}/editar(id=${item.id})}">
              <i class="bi bi-pencil"></i>Editar
            </a>
            <a class="btn btn-sm btn-outline-danger" th:href="@{/materias/baja/{id}(id=${item.id})}"
               th:attr="data-confirm=${'¿Dar de baja la materia ' + item.nombre + '?'}">
              <i class="bi bi-trash"></i>Eliminar
            </a>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-state" th:if="${items.isEmpty()}">
    <i class="bi bi-book"></i>
    <p class="empty-title">Sin materias registradas</p>
    <p>Registre las materias de la institución para asociarlas a los cursos y cargos.</p>
    <a class="btn btn-primary mt-3" th:href="@{/materias/nuevo}">
      <i class="bi bi-plus-lg me-1"></i>Nueva materia
    </a>
  </div>

  <div class="empty-state d-none" data-filter-empty="tablaMaterias" th:if="${!items.isEmpty()}">
    <i class="bi bi-search"></i>
    <p class="empty-title">Sin resultados</p>
    <p>Ninguna materia coincide con la búsqueda ingresada.</p>
  </div>

</section>
</html>
