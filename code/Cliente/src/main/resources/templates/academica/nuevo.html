<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Nuevo curso', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 data-subtitle="Registro de un curso de la institución">Nuevo curso</h3>
</section>
<section id="contenido">


  <form method="post" th:action="@{/academica/actualizar}" th:object="${item}" data-loading>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div class="mb-3">
      <label for="anio">Año</label>
      <input class="form-control" id="anio" type="number" min="1" th:field="*{anio}" required>
      <div class="form-text">Año del curso según el nivel educativo.</div>
    </div>

    <div class="d-flex flex-wrap gap-2 mt-3">
      <a class="btn btn-outline-secondary" th:href="@{/academica/list}">
        <i class="bi bi-arrow-left me-1"></i>Cancelar
      </a>
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-lg me-1"></i>Guardar curso
      </button>
    </div>
  </form>

</section>
</html>
