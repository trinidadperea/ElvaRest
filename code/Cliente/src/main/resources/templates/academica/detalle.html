<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Detalle del curso', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 th:attr="data-subtitle='Cursos y materias de la institución'">
    <span th:text="${item.anio} + '° Año'"></span></h3>
</section>
<section id="contenido">


  <!-- ============ Datos del curso ============ -->
  <div class="card">
    <div class="card-header d-flex align-items-center gap-2">
      <h3 class="card-title mb-0">Datos del curso</h3>
      <span class="badge rounded-pill ms-auto text-bg-secondary"
            th:text="${materias != null ? #lists.size(materias) : 0} + ' materia(s)'"></span>
    </div>
    <div class="card-body">
      <div class="detail-grid">
        <div class="detail-item">
          <dt>Año</dt>
          <dd th:text="${item.anio} + '° Año'"></dd>
        </div>
        <div class="detail-item">
          <dt>Materias asociadas</dt>
          <dd th:text="${materias != null ? #lists.size(materias) : 0}"></dd>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ Materias del curso ============ -->
  <div class="card">
    <div class="card-header d-flex align-items-center gap-2">
      <h3 class="card-title mb-0">Materias del curso</h3>
    </div>
    <div class="card-body">
      <div class="table-responsive" th:if="${materias != null and !materias.isEmpty()}">
        <table class="table">
          <thead>
          <tr>
            <th>Materia</th>
            <th>Área</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="materia : ${materias}">
            <td>
              <span class="fw-semibold"
                    th:text="${materia.nombre != null and !materia.nombre.isBlank() ? materia.nombre : 'Materia sin nombre'}"></span>
            </td>
            <td th:text="${materia.area != null and !materia.area.isBlank() ? materia.area : '—'}"></td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="empty-state" th:if="${materias == null or materias.isEmpty()}">
        <i class="bi bi-journal-x"></i>
        <p class="empty-title">Sin materias asociadas</p>
        <p>Este curso todavía no tiene materias registradas.</p>
      </div>
    </div>
  </div>

  <!-- ============ Acciones ============ -->
  <div class="list-toolbar">
    <div class="toolbar-filters">
      <a class="btn btn-outline-secondary" th:href="@{/academica/list}">
        <i class="bi bi-arrow-left me-1"></i>Volver al listado
      </a>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-outline-danger" th:href="@{/academica/baja/{id}(id=${item.id})}"
         th:attr="data-confirm=${'¿Dar de baja el curso ' + item.anio + '° Año?'}">
        <i class="bi bi-trash me-1"></i>Eliminar
      </a>
      <a class="btn btn-primary" th:href="@{/academica/{id}/editar(id=${item.id})}">
        <i class="bi bi-pencil me-1"></i>Editar curso
      </a>
    </div>
  </div>

</section>
</html>
