<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Docentes', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 data-subtitle="Plantel docente activo e inactivo del sistema">Docentes</h3>
</section>
<section id="contenido">


  <div class="list-toolbar">
    <div class="toolbar-search">
      <input class="form-control" type="search" data-filter-input="#tablaDocentes"
             placeholder="Buscar por nombre, documento o área…" aria-label="Buscar docentes">
    </div>
    <div class="toolbar-filters">
      <a class="btn btn-primary" th:href="@{/docentes/nuevo}">
        <i class="bi bi-plus-lg me-1"></i>Nuevo docente
      </a>
    </div>
  </div>

  <div class="table-responsive" th:if="${!items.isEmpty()}">
    <table class="table" id="tablaDocentes">
      <thead>
      <tr>
        <th>Docente</th>
        <th>Documento</th>
        <th>Área</th>
        <th>Estado</th>
        <th class="text-end">Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${items}">
        <td>
          <a class="fw-semibold text-decoration-none" th:href="@{/docentes/{id}(id=${item.id})}"
             th:text="${item.apellido + ', ' + item.nombre}"></a>
          <span class="badge rounded-pill text-bg-info ms-1" th:if="${item.tipo?.name() == 'PRECEPTOR'}">Preceptor</span>
          <span class="d-block text-secondary small" th:if="${item.interno}">Interno</span>
        </td>
        <td th:text="${item.numeroDocumento != null ? item.numeroDocumento : '—'}"></td>
        <td th:text="${item.area != null and !item.area.isBlank() ? item.area : '—'}"></td>
        <td>
          <span class="badge rounded-pill"
                th:classappend="${item.activo ? 'text-bg-success' : 'text-bg-secondary'}"
                th:text="${item.activo ? 'Activo' : 'Inactivo'}"></span>
        </td>
        <td>
          <div class="table-actions">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/docentes/{id}(id=${item.id})}">
              <i class="bi bi-eye"></i>Ver
            </a>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/docentes/{id}/editar(id=${item.id})}">
              <i class="bi bi-pencil"></i>Editar
            </a>
            <a class="btn btn-sm btn-outline-danger" th:href="@{/docentes/baja/{id}(id=${item.id})}"
               th:attr="data-confirm='¿Dar de baja a ' + ${item.apellido + ', ' + item.nombre} + '? La acción se puede revertir desde la edición.'">
              <i class="bi bi-trash"></i>Eliminar
            </a>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-state" th:if="${items.isEmpty()}">
    <i class="bi bi-people"></i>
    <p class="empty-title">Sin docentes registrados</p>
    <p>Registre el primer docente para comenzar a gestionar concursos y designaciones.</p>
    <a class="btn btn-primary mt-3" th:href="@{/docentes/nuevo}">
      <i class="bi bi-plus-lg me-1"></i>Nuevo docente
    </a>
  </div>

  <div class="empty-state d-none" data-filter-empty="tablaDocentes" th:if="${!items.isEmpty()}">
    <i class="bi bi-search"></i>
    <p class="empty-title">Sin resultados</p>
    <p>Ningún docente coincide con la búsqueda ingresada.</p>
  </div>

</section>
</html>
