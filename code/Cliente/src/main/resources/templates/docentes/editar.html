<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Editar docente', ~{::#encabezado}, ~{::#contenido})}">
<section id="encabezado"><h3>Editar docente</h3></section>
<section id="contenido"><form method="post" th:action="@{/docentes/actualizar}" th:object="${item}">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{id}">
  <div class="mb-3"><label>Nombre</label><input class="form-control" th:field="*{nombre}" required></div><div class="mb-3"><label>Apellido</label><input class="form-control" th:field="*{apellido}" required></div>
  <div class="mb-3"><label>Fecha de nacimiento</label><input class="form-control" type="date" th:field="*{fechaNacimiento}" required></div><div class="mb-3"><label>Documento</label><input class="form-control" th:field="*{numeroDocumento}" required></div>
  <div class="mb-3"><label>Telefono</label><input class="form-control" th:field="*{telefono}" required></div><div class="mb-3"><label>Correo</label><input class="form-control" type="email" th:field="*{correoElectronico}" required></div>
  <div class="mb-3"><label>Area</label><input class="form-control" th:field="*{area}" required></div><div class="mb-3"><label>Puntaje</label><input class="form-control" type="number" step="0.01" th:field="*{puntaje}"></div>
  <label class="form-check"><input class="form-check-input" type="checkbox" th:field="*{activo}"> Activo</label><label class="form-check"><input class="form-check-input" type="checkbox" th:field="*{interno}"> Interno</label>
  <div class="mt-3"><a class="btn btn-secondary" th:href="@{/docentes}">Cancelar</a><button class="btn btn-primary">Guardar</button></div>
</form></section></html>
