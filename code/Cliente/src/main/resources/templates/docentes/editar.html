<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Editar docente', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 th:attr="data-subtitle='Modificando: ' + ${item.apellido + ', ' + item.nombre}">Editar docente</h3>
</section>
<section id="contenido">


  <form method="post" th:action="@{/docentes/actualizar}" th:object="${item}" data-loading>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
      <label for="nombre">Nombre *</label>
      <input class="form-control" id="nombre" th:field="*{nombre}" required>
    </div>
    <div class="mb-3">
      <label for="apellido">Apellido *</label>
      <input class="form-control" id="apellido" th:field="*{apellido}" required>
    </div>
    <div class="mb-3">
      <label for="fechaNacimiento">Fecha de nacimiento *</label>
      <input class="form-control" id="fechaNacimiento" type="date" th:field="*{fechaNacimiento}" required>
    </div>
    <div class="mb-3">
      <label for="numeroDocumento">Número de documento *</label>
      <input class="form-control" id="numeroDocumento" th:field="*{numeroDocumento}" required>
    </div>
    <div class="mb-3">
      <label for="telefono">Teléfono *</label>
      <input class="form-control" id="telefono" th:field="*{telefono}" required>
    </div>
    <div class="mb-3">
      <label for="correoElectronico">Correo electrónico *</label>
      <input class="form-control" id="correoElectronico" type="email" th:field="*{correoElectronico}" required>
    </div>
    <div class="mb-3">
      <label for="area">Área *</label>
      <input class="form-control" id="area" th:field="*{area}" required>
    </div>
    <div class="mb-3">
      <label for="tipo">Tipo *</label>
      <select class="form-select" id="tipo" th:field="*{tipo}" required>
        <option value="DOCENTE">Docente</option>
        <option value="PRECEPTOR">Preceptor</option>
      </select>
      <div class="form-text">Los preceptores solo pueden postularse a cargos de preceptor, y los docentes al resto.</div>
    </div>

    <!-- Activo oculto: preserva el estado actual del docente al guardar la modificación. -->
    <input type="hidden" name="activo" th:value="${item.activo}">
    <!-- Interno oculto: preserva el estado actual del docente al guardar la modificación. -->
    <input type="hidden" name="interno" th:value="${item.interno}">

    <div class="mt-4 pt-2 border-top d-flex justify-content-end gap-2">
      <a class="btn btn-outline-secondary" th:href="@{/docentes}">Cancelar</a>
      <a class="btn btn-outline-primary" th:href="@{/docentes/{id}(id=${item.id})}">
        <i class="bi bi-eye me-1"></i>Ver detalle
      </a>
      <button class="btn btn-primary" type="submit">
        <i class="bi bi-check-lg me-1"></i>Guardar cambios
      </button>
    </div>
  </form>

</section>
</html>
