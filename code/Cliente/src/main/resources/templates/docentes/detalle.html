<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Detalle del docente', ~{::#encabezado}, ~{::#contenido})}">
<section id="encabezado"><h3>Detalle del docente</h3></section><section id="contenido"><dl><dt>Nombre</dt><dd th:text="${item.apellido + ', ' + item.nombre}"></dd><dt>Documento</dt><dd th:text="${item.numeroDocumento}"></dd><dt>Area</dt><dd th:text="${item.area}"></dd><dt>Activo</dt><dd th:text="${item.activo}"></dd></dl><a class="btn btn-secondary" th:href="@{/docentes}">Volver</a><a class="btn btn-warning" th:href="@{/docentes/{id}/editar(id=${item.id})}">Editar</a></section></html>
