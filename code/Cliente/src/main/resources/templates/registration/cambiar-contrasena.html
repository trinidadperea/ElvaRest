<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña - ElvaRest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/adminlte/css/adminlte.min.css}">
  <link rel="stylesheet" th:href="@{/css/school-theme.css}">
</head>
<body class="login-page bg-body-secondary">
  <div class="login-box">
    <div class="login-logo">
      <a th:href="@{/}"><b>Gestión de</b> Concursos</a>
    </div>
    <div class="card">
      <div class="card-body login-card-body">
        <p class="login-box-msg">Por seguridad, debés cambiar tu contraseña para continuar.</p>

        <div class="alert alert-danger" th:if="${msgError}" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>
          <span th:text="${msgError}">Ocurrió un error.</span>
        </div>

        <form method="post" th:action="@{/usuarios/cambiar-contrasena}" class="auth-form" data-loading>
          <input type="hidden" th:if="${_csrf != null}"
                 th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="input-group mb-3">
            <input type="password" name="contraseñaActual" class="form-control"
                   placeholder="Contraseña actual" required autofocus autocomplete="current-password">
            <div class="input-group-text"><span class="bi bi-lock"></span></div>
          </div>
          <div class="input-group mb-3">
            <input type="password" name="contraseñaNueva" class="form-control"
                   placeholder="Nueva contraseña" required autocomplete="new-password">
            <div class="input-group-text"><span class="bi bi-lock-fill"></span></div>
          </div>
          <div class="input-group mb-3">
            <input type="password" name="contraseñaConfirmacion" class="form-control"
                   placeholder="Repetí la nueva contraseña" required autocomplete="new-password">
            <div class="input-group-text"><span class="bi bi-shield-check"></span></div>
          </div>
          <div class="row">
            <div class="col-12">
              <button type="submit" class="btn btn-primary d-grid w-100">Cambiar contraseña</button>
            </div>
          </div>
        </form>

        <div class="mt-3 d-grid">
          <form method="post" th:action="@{/logout}">
            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-secondary d-grid w-100">Cerrar sesión</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script th:src="@{/adminlte/js/adminlte.min.js}"></script>
</body>
</html>
