<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Designaciones', ~{::#encabezado}, ~{::#contenido})}">
<section id="encabezado"><h3>Gestión de designaciones</h3></section>
<section id="contenido">
  <a class="btn btn-primary mb-3" th:href="@{/designaciones/nuevo}"><i class="bi bi-plus-lg me-2"></i>Nueva designación</a>
  <div class="card mb-4"><div class="card-body py-3"><div class="input-group"><span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-secondary"></i></span><input class="form-control border-start-0" type="search" placeholder="Buscar por origen o estado..." aria-label="Buscar designaciones"></div></div></div>
  <div class="table-responsive"><table class="table"><thead><tr><th>Origen de vacancia</th><th>Fecha de inicio</th><th>Carácter</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
  <tbody><tr th:each="item : ${items}"><td class="fw-semibold" th:text="${item.origenVacancia}"></td><td th:text="${item.fechaInicioEfectiva}"></td><td><span class="badge rounded-pill text-bg-light text-primary" th:text="${item.caracterDesignacion}"></span></td><td><span class="badge rounded-pill text-bg-success" th:text="${item.estadoDesignacion}"></span></td>
    <td class="text-end"><a class="btn btn-sm btn-info" aria-label="Ver detalle" th:href="@{/designaciones/{id}(id=${item.id})}">Ver</a><a class="btn btn-sm btn-warning" aria-label="Editar" th:href="@{/designaciones/{id}/editar(id=${item.id})}">Editar</a><a class="btn btn-sm btn-danger" aria-label="Eliminar" th:href="@{/designaciones/baja/{id}(id=${item.id})}">Eliminar</a></td>
  </tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="5" class="text-center text-secondary py-5">Aún no hay designaciones registradas.</td></tr></tbody></table></div>
</section></html>
