<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Designaciones', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 data-subtitle="Designaciones docentes registradas en el sistema">Gestión de designaciones</h3>
</section>
<section id="contenido">


  <div class="list-toolbar">
    <div class="toolbar-search">
      <input class="form-control" type="search" data-filter-input="#tablaDesignaciones"
             placeholder="Buscar por docente, origen o carácter…" aria-label="Buscar designaciones">
    </div>
  </div>

  <div class="table-responsive" th:if="${!items.isEmpty()}">
    <table class="table" id="tablaDesignaciones">
      <thead>
      <tr>
        <th>Docente</th>
        <th>Origen de vacancia</th>
        <th>Carácter</th>
        <th>Inicio</th>
        <th>Fin</th>
        <th>Estado</th>
        <th class="text-end">Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${items}">
        <td>
          <span class="fw-semibold"
                th:text="${item.docente != null ? item.docente.apellido + ', ' + item.docente.nombre : 'Sin docente asignado'}"></span>
        </td>
        <td th:text="${item.origenVacancia != null and !item.origenVacancia.isBlank() ? item.origenVacancia : '—'}"></td>
        <td>
          <span class="badge rounded-pill text-bg-light text-primary"
                th:text="${item.caracterDesignacion != null ? item.caracterDesignacion : '—'}"></span>
        </td>
        <td th:text="${item.fechaInicioEfectiva != null ? #temporals.format(item.fechaInicioEfectiva, 'dd/MM/yyyy') : '—'}"></td>
        <td th:text="${item.fechaFinDefinitiva != null ? #temporals.format(item.fechaFinDefinitiva, 'dd/MM/yyyy') : ''}"></td>
        <td>
          <span class="badge rounded-pill"
                th:classappend="${item.estadoDesignacion == T(com.elvarest.cliente.dto.enums.EstadoDesignacion).ACTIVO ? 'text-bg-success' : (item.estadoDesignacion == T(com.elvarest.cliente.dto.enums.EstadoDesignacion).PENDIENTE ? 'text-bg-warning' : 'text-bg-secondary')}"
                th:text="${item.estadoDesignacion != null ? item.estadoDesignacion : '—'}"></span>
        </td>
        <td>
          <div class="table-actions">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/designaciones/{id}(id=${item.id})}">
              <i class="bi bi-eye"></i>Ver
            </a>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/designaciones/{id}/editar(id=${item.id})}">
              <i class="bi bi-pencil"></i>Editar
            </a>
            <a class="btn btn-sm btn-outline-danger" th:href="@{/designaciones/baja/{id}(id=${item.id})}"
               data-confirm="¿Dar de baja esta designación? La acción se puede revertir desde la edición.">
              <i class="bi bi-trash"></i>Eliminar
            </a>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-state" th:if="${items.isEmpty()}">
    <i class="bi bi-clipboard-check"></i>
    <p class="empty-title">Sin designaciones registradas</p>
    <p>Las designaciones se generan al confirmar la toma de posesión en un concurso.</p>
  </div>

  <div class="empty-state d-none" data-filter-empty="tablaDesignaciones" th:if="${!items.isEmpty()}">
    <i class="bi bi-search"></i>
    <p class="empty-title">Sin resultados</p>
    <p>Ninguna designación coincide con la búsqueda ingresada.</p>
  </div>

</section>
</html>
