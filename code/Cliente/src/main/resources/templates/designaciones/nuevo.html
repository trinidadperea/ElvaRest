<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Nueva designacion', ~{::#encabezado}, ~{::#contenido})}">
<section id="encabezado"><h3>Nueva designación</h3></section>
<section id="contenido"><form method="post" th:action="@{/designaciones/actualizar}" th:object="${item}">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
  <h5 class="mb-4">Datos de la designación</h5><div class="mb-3"><label>Fecha de inicio</label><input class="form-control" type="date" th:field="*{fechaInicioEfectiva}" required></div>
  <div class="mb-3"><label>Fecha fin estimada</label><input class="form-control" type="date" th:field="*{fechaFinEstimada}" required></div>
  <div class="mb-3"><label>Origen de vacancia</label><input class="form-control" th:field="*{origenVacancia}" placeholder="Ej.: Licencia, jubilación o renuncia" required></div>
  <div class="mb-3"><label>Caracter</label><select class="form-select" th:field="*{caracterDesignacion}"><option value="">Seleccione</option><option th:each="value : ${T(com.elvarest.cliente.dto.enums.CaracterDesignacion).values()}" th:value="${value}" th:text="${value}"></option></select></div>
  <div class="mb-3"><label>Estado</label><select class="form-select" th:field="*{estadoDesignacion}"><option value="">Seleccione</option><option th:each="value : ${T(com.elvarest.cliente.dto.enums.EstadoDesignacion).values()}" th:value="${value}" th:text="${value}"></option></select></div>
  <div class="d-flex gap-2 mt-3"><a class="btn btn-secondary" th:href="@{/designaciones}">Cancelar</a><button class="btn btn-primary"><i class="bi bi-check-lg me-2"></i>Guardar designación</button></div>
</form></section></html>
