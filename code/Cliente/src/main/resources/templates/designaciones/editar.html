<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Editar designación', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 data-subtitle="Ajuste los datos de la designación">Editar designación</h3>
</section>
<section id="contenido">


  <form method="post" th:action="@{/designaciones/actualizar}" th:object="${item}" data-loading>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" th:field="*{id}">
    <input type="hidden" name="cargoId" th:if="${cargoOrigenId != null}" th:value="${cargoOrigenId}">

    <div class="mb-3">
      <label for="docente">Docente *</label>
      <select class="form-select" id="docente" name="docente.id" required>
        <option value="">Seleccione un docente</option>
        <option th:each="docente : ${docentes}" th:value="${docente.id}"
                th:selected="${item.docente != null and item.docente.id == docente.id}"
                th:text="${docente.apellido + ', ' + docente.nombre + (docente.area != null ? ' — ' + docente.area : '')}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label for="fechaInicioEfectiva">Fecha de inicio *</label>
      <input class="form-control" id="fechaInicioEfectiva" type="date" th:field="*{fechaInicioEfectiva}" required>
    </div>
    <div class="mb-3">
      <label for="fechaFinDefinitiva">Fecha de fin definitiva</label>
      <input class="form-control" id="fechaFinDefinitiva" type="date" th:field="*{fechaFinDefinitiva}">
      <div class="form-text">Complete este campo solo si la designación ya finalizó.</div>
    </div>
    <div class="mb-3">
      <label for="origenVacancia">Origen de vacancia *</label>
      <input class="form-control" id="origenVacancia" th:field="*{origenVacancia}" required>
    </div>
    <div class="mb-3">
      <label for="caracterDesignacion">Carácter *</label>
      <select class="form-select" id="caracterDesignacion" th:field="*{caracterDesignacion}" required>
        <option th:each="value : ${T(com.elvarest.cliente.dto.enums.CaracterDesignacion).values()}"
                th:value="${value}" th:text="${value}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label for="estadoDesignacion">Estado *</label>
      <select class="form-select" id="estadoDesignacion" th:field="*{estadoDesignacion}" required>
        <option th:each="value : ${T(com.elvarest.cliente.dto.enums.EstadoDesignacion).values()}"
                th:value="${value}" th:text="${value}"></option>
      </select>
    </div>

    <div class="mt-4 pt-2 border-top d-flex justify-content-end gap-2">
      <!-- Cancelar conserva el cargo de origen cuando la edición se abrió desde "Cargo → Ver" -->
      <a th:if="${cargoOrigenId != null}" class="btn btn-outline-secondary"
         th:href="@{/cargos/{id}(id=${cargoOrigenId})}">Cancelar</a>
      <a th:unless="${cargoOrigenId != null}" class="btn btn-outline-secondary"
         th:href="@{/designaciones}">Cancelar</a>
      <button class="btn btn-primary" type="submit">
        <i class="bi bi-check-lg me-1"></i>Guardar cambios
      </button>
    </div>
  </form>

</section>
</html>
