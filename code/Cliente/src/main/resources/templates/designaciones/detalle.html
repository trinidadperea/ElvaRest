<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Detalle de designacion', ~{::#encabezado}, ~{::#contenido})}">
<section id="encabezado"><h3>Detalle de designación</h3></section><section id="contenido"><dl><dt>Origen de vacancia</dt><dd th:text="${item.origenVacancia}"></dd><dt>Fecha de inicio</dt><dd th:text="${item.fechaInicioEfectiva}"></dd><dt>Fecha de fin estimada</dt><dd th:text="${item.fechaFinEstimada}"></dd><dt>Carácter</dt><dd th:text="${item.caracterDesignacion}"></dd><dt>Estado</dt><dd><span class="badge rounded-pill text-bg-success" th:text="${item.estadoDesignacion}"></span></dd></dl><div class="d-flex gap-2 mt-3"><a class="btn btn-secondary" th:href="@{/cargos}"><i class="bi bi-arrow-left me-2"></i>Volver</a><a class="btn btn-primary" th:href="@{/designaciones/{id}/editar(id=${item.id})}"><i class="bi bi-pencil me-2"></i>Editar</a></div></section></html>
