<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Detalle de designacion', ~{::#encabezado}, ~{::#contenido})}">
<section id="encabezado"><h3>Detalle de designacion</h3></section><section id="contenido"><dl><dt>Origen</dt><dd th:text="${item.origenVacancia}"></dd><dt>Inicio</dt><dd th:text="${item.fechaInicioEfectiva}"></dd><dt>Estado</dt><dd th:text="${item.estadoDesignacion}"></dd></dl><a class="btn btn-secondary" th:href="@{/designaciones}">Volver</a><a class="btn btn-warning" th:href="@{/designaciones/{id}/editar(id=${item.id})}">Editar</a></section></html>
