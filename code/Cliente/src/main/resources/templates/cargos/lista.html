<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{base :: layout('Gestión de cargos', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 data-subtitle="Cargos con su carga horaria, materia y designaciones vigentes">Gestión de cargos</h3>
</section>
<section id="contenido">


  <div class="list-toolbar">
    <div class="toolbar-search">
      <input class="form-control" type="search" data-filter-input="#tablaCargos"
             placeholder="Buscar por cargo, materia o curso…" aria-label="Buscar cargos">
    </div>
    <div class="toolbar-filters">
      <a class="btn btn-primary" th:href="@{/cargos/nuevo}" sec:authorize="hasRole('ADMIN')">
        <i class="bi bi-plus-lg me-1"></i>Nuevo cargo
      </a>
    </div>
  </div>

  <div class="table-responsive" th:if="${!items.isEmpty()}">
    <table class="table" id="tablaCargos">
      <thead>
      <tr>
        <th>Cargo</th>
        <th>Carga horaria</th>
        <th>Designaciones activas</th>
        <th class="text-end">Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="cargo : ${items}">
        <td>
          <a class="fw-semibold text-decoration-none" th:href="@{/cargos/{id}(id=${cargo.id})}"
             th:text="${cargo.descripcion}"></a>
          <span class="d-block text-secondary small">
            <th:block th:if="${cargo.materia != null}"
                      th:text="${cargo.materia.nombre + (cargo.materia.curso != null ? ' · ' + cargo.materia.curso.anio + '° Año' : '')}"></th:block>
            <th:block th:if="${cargo.materia == null}">Sin materia asignada</th:block>
          </span>
        </td>
        <td th:text="${cargo.cargaHoraria} + ' h'"></td>
        <td>
          <span class="badge rounded-pill text-bg-secondary"
                th:text="${cargosDesignacionesActivas != null and cargosDesignacionesActivas[cargo.id] != null ? cargosDesignacionesActivas[cargo.id] : 0}"></span>
        </td>
        <td>
          <div class="table-actions">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/cargos/{id}(id=${cargo.id})}">
              <i class="bi bi-eye"></i>Ver
            </a>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/cargos/{id}/editar(id=${cargo.id})}">
              <i class="bi bi-pencil"></i>Editar
            </a>
            <a class="btn btn-sm btn-outline-danger" th:href="@{/cargos/baja/{id}(id=${cargo.id})}"
               th:attr="data-confirm='¿Dar de baja el cargo «' + ${cargo.descripcion} + '»? Sus designaciones asociadas dejarán de estar disponibles.'">
              <i class="bi bi-trash"></i>Eliminar
            </a>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-state" th:if="${items.isEmpty()}">
    <i class="bi bi-briefcase"></i>
    <p class="empty-title">Sin cargos registrados</p>
    <p>Cree el primer cargo con su carga horaria para poder abrir concursos.</p>
    <a class="btn btn-primary mt-3" th:href="@{/cargos/nuevo}" sec:authorize="hasRole('ADMIN')">
      <i class="bi bi-plus-lg me-1"></i>Nuevo cargo
    </a>
  </div>

  <div class="empty-state d-none" data-filter-empty="tablaCargos" th:if="${!items.isEmpty()}">
    <i class="bi bi-search"></i>
    <p class="empty-title">Sin resultados</p>
    <p>Ningún cargo coincide con la búsqueda ingresada.</p>
  </div>

</section>
</html>
