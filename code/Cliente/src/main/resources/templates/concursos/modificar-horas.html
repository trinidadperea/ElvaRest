<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Modificar horas', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 data-subtitle="Solo disponible mientras el concurso está abierto">Modificar horas del docente</h3>
</section>
<section id="contenido">
  <div class="card">
    <div class="card-body">
      <div class="detail-grid">
        <div class="detail-item">
          <dt>Docente</dt>
          <dd th:text="${postulacion.docente != null ? postulacion.docente.apellido + ', ' + postulacion.docente.nombre : 'Docente sin datos'}"></dd>
        </div>
        <div class="detail-item">
          <dt>Estado</dt>
          <dd><span class="status-badge" th:classappend="${estadoPostulacion.badgeClass}"
                    th:text="${estadoPostulacion.etiqueta}"></span></dd>
        </div>
        <div class="detail-item">
          <dt>Horas actuales</dt>
          <dd th:text="${horasActuales} + ' h'"></dd>
        </div>
        <div class="detail-item">
          <dt>Horas disponibles del concurso</dt>
          <dd th:text="${horasDisponibles != null ? horasDisponibles + ' h' : '—'}"></dd>
        </div>
        <div class="detail-item" th:if="${horasMaximas != null}">
          <dt>Máximo permitido</dt>
          <dd th:text="${horasMaximas} + ' h'"></dd>
        </div>
      </div>
      <p class="text-secondary small mt-3 mb-0">
        Máximo permitido = horas actuales del docente + horas disponibles del concurso.
        Puede aumentar o reducir la toma de horas; el saldo se recalcula inmediatamente al guardar.
      </p>
    </div>
  </div>

  <form method="post" data-loading
        th:action="@{/concursos/{cid}/postulaciones/{pid}/horas(cid=${concurso.id}, pid=${postulacion.id})}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-3">
      <label for="horasNuevas">Nuevas horas</label>
      <input id="horasNuevas" class="form-control" type="number" name="horasNuevas" min="1"
             th:value="${horasActuales}" th:attr="max=${horasMaximas}" required>
      <div class="form-text" th:if="${horasMaximas != null}"
           th:text="'Entre 1 y ' + ${horasMaximas} + ' horas.'"></div>
    </div>
    <div class="d-flex gap-2 mt-3">
      <a class="btn btn-secondary" th:href="@{/concursos/{id}(id=${concurso.id})}">Cancelar</a>
      <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar horas</button>
    </div>
  </form>
</section>
</html>
