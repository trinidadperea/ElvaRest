<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Editar concurso', ~{::#encabezado}, ~{::#contenido})}">
<section id="encabezado"><h3>Editar concurso</h3></section>
<section id="contenido"><form method="post" th:action="@{/concursos/actualizar}" th:object="${item}">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{id}">
  <div class="mb-3"><label>Descripcion</label><input class="form-control" th:field="*{descripcion}" required></div>
  <div class="mb-3"><label>Fecha de apertura</label><input class="form-control" type="date" th:field="*{fechaApertura}" required></div>
  <div class="mb-3"><label>Fecha de cierre</label><input class="form-control" type="date" th:field="*{fechaCierre}" required></div>
  <div class="mb-3"><label>Estado</label><select class="form-select" th:field="*{estadoConcurso}" required><option th:each="value : ${T(com.elvarest.cliente.dto.enums.EstadoConcurso).values()}" th:value="${value}" th:text="${value}"></option></select></div>
  <a class="btn btn-secondary" th:href="@{/concursos}">Cancelar</a><button class="btn btn-primary">Guardar</button>
</form></section></html>
