<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Confirmar toma de posesión', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 data-subtitle="Paso 3: al confirmar, la designación queda activa y definitiva">Confirmar toma de posesión</h3>
</section>
<section id="contenido">
  <div class="card">
    <div class="card-body">
      <div class="detail-grid">
        <div class="detail-item">
          <dt>Docente</dt>
          <dd th:text="${postulacion.docente != null ? postulacion.docente.apellido + ', ' + postulacion.docente.nombre : 'Docente sin datos'}"></dd>
        </div>
        <div class="detail-item">
          <dt>Designación</dt>
          <dd th:text="${concurso.caracterDesignacion != null ? concurso.caracterDesignacion : 'Sin definir'}"></dd>
        </div>
        <div class="detail-item">
          <dt>Horas asignadas</dt>
          <dd th:text="${horasPostulacion != null ? horasPostulacion + ' h' : '—'}"></dd>
        </div>
        <div class="detail-item">
          <dt>Cargo / concurso</dt>
          <dd th:text="${concurso.cargo != null ? concurso.cargo.descripcion : concurso.descripcion}"></dd>
        </div>
      </div>
      <p class="text-secondary small mt-3 mb-0">
        Al confirmar, se crea la designación <strong>activa</strong> y la postulación pasa a
        <strong>designación definitiva</strong>. Si el concurso completa todas sus horas, se cerrará automáticamente.
      </p>
    </div>
  </div>

  <form method="post" th:action="@{/concursos/{cid}/postulaciones/{pid}/posesion(cid=${concurso.id}, pid=${postulacion.id})}"
        th:object="${item}" data-loading>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-3">
      <label for="fechaInicioEfectiva">Fecha de inicio efectiva</label>
      <input id="fechaInicioEfectiva" class="form-control" type="date" th:field="*{fechaInicioEfectiva}" required>
    </div>
    <div class="mb-3">
      <label for="fechaFinDefinitiva">Fecha de fin definitiva</label>
      <input id="fechaFinDefinitiva" class="form-control" type="date" th:field="*{fechaFinDefinitiva}" required>
    </div>
    <div class="d-flex flex-wrap gap-2 mt-3">
      <a class="btn btn-secondary" th:href="@{/concursos/{id}(id=${concurso.id})}">Cancelar</a>
      <button class="btn btn-success"><i class="bi bi-person-check me-1"></i>Confirmar toma de posesión</button>
    </div>
  </form>
</section>
</html>
