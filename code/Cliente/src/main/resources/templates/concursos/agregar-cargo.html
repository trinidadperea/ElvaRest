<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Agregar cargo', ~{::#encabezado}, ~{::#contenido})}">
<section id="encabezado"><h3>Agregar cargo al docente ganador</h3></section>
<section id="contenido">
  <div class="card mb-3">
    <div class="card-body">
      <strong>Concurso:</strong> <span th:text="${concurso.descripcion}"></span>
      <span class="d-block mt-2"><strong>Docente:</strong>
        <span th:text="${item.docente.apellido + ', ' + item.docente.nombre}"></span>
      </span>
    </div>
  </div>
  <form method="post" th:action="@{/concursos/{id}/agregar-cargo(id=${concurso.id})}" th:object="${item}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-3">
      <label>Fecha de inicio</label>
      <input class="form-control" type="date" th:field="*{fechaInicioEfectiva}" required>
    </div>
    <div class="mb-3">
      <label>Fecha de fin estimada</label>
      <input class="form-control" type="date" th:field="*{fechaFinEstimada}" required>
    </div>
    <div class="mb-3">
      <label>Tipo de cargo</label>
      <select class="form-select" th:field="*{caracterDesignacion}" required>
        <option value="">Seleccione</option>
        <option th:each="tipo : ${tipoDesignaciones}" th:value="${tipo}" th:text="${tipo}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label>Estado inicial</label>
      <select class="form-select" th:field="*{estadoDesignacion}" required>
        <option th:each="estado : ${estadosDesignacion}" th:value="${estado}" th:text="${estado}"></option>
      </select>
    </div>
    <div class="d-flex gap-2 mt-3">
      <a class="btn btn-secondary" th:href="@{/concursos/list}">Cancelar</a>
      <button class="btn btn-primary"><i class="bi bi-briefcase me-2"></i>Agregar cargo</button>
    </div>
  </form>
</section>
</html>
