<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Detalle de concurso', ~{::#encabezado}, ~{::#contenido})}">
<section id="encabezado"><h3>Detalle de concurso</h3></section><section id="contenido"><dl><dt>Descripcion</dt><dd th:text="${item.descripcion}"></dd><dt>Apertura</dt><dd th:text="${item.fechaApertura}"></dd><dt>Cierre</dt><dd th:text="${item.fechaCierre}"></dd><dt>Estado</dt><dd th:text="${item.estadoConcurso}"></dd></dl><a class="btn btn-secondary" th:href="@{/concursos}">Volver</a><a class="btn btn-warning" th:href="@{/concursos/{id}/editar(id=${item.id})}">Editar</a></section></html>
