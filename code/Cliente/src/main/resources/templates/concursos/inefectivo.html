<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Declarar inefectivo', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 data-subtitle="Las horas del docente vuelven inmediatamente a estar disponibles">Declarar inefectivo / no presentado</h3>
</section>
<section id="contenido">
  <div class="card">
    <div class="card-body">
      <div class="detail-grid">
        <div class="detail-item">
          <dt>Docente</dt>
          <dd th:text="${postulacion.docente != null ? postulacion.docente.apellido + ', ' + postulacion.docente.nombre : 'Docente sin datos'}"></dd>
        </div>
        <div class="detail-item">
          <dt>Horas a restituir</dt>
          <dd th:text="${horasPostulacion != null ? horasPostulacion + ' h' : '—'}"></dd>
        </div>
        <div class="detail-item">
          <dt>Concurso</dt>
          <dd th:text="${concurso.descripcion}"></dd>
        </div>
      </div>
      <p class="text-secondary small mt-3 mb-0">
        La postulación pasará a <strong>cancelado / inefectivo</strong> y quedará registrada en el concurso con su observación.
        Las horas liberadas permiten ampliar horas de otros docentes, registrar uno nuevo o generar un rellamado.
      </p>
    </div>
  </div>

  <form method="post" data-loading
        th:action="@{/concursos/{cid}/postulaciones/{pid}/inefectivo(cid=${concurso.id}, pid=${postulacion.id})}"
        data-confirm="¿Declarar inefectivo al docente? Sus horas volverán inmediatamente al concurso.">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-3">
      <label for="observacion">Observación (opcional)</label>
      <textarea id="observacion" class="form-control" name="observacion" rows="3"
                placeholder="Ej.: No se presentó al inicio de clases."></textarea>
    </div>
    <div class="d-flex flex-wrap gap-2 mt-3">
      <a class="btn btn-secondary" th:href="@{/concursos/{id}(id=${concurso.id})}">Cancelar</a>
      <button class="btn btn-danger"><i class="bi bi-person-x me-1"></i>Confirmar declaración de inefectividad</button>
    </div>
  </form>
</section>
</html>
