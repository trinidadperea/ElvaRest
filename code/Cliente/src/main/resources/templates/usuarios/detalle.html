<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Detalle del usuario', ~{::#encabezado}, ~{::#contenido})}">
<section id="encabezado"><h3>Detalle del usuario</h3></section><section id="contenido"><dl><dt>Nombre</dt><dd th:text="${item.apellido + ', ' + item.nombre}"></dd><dt>Usuario</dt><dd th:text="${item.nombreUsuario}"></dd><dt>Correo</dt><dd th:text="${item.correoElectronico}"></dd><dt>Rol</dt><dd th:text="${item.rol}"></dd></dl><a class="btn btn-secondary" th:href="@{/usuarios}">Volver</a><a class="btn btn-warning" th:href="@{/usuarios/{id}/editar(id=${item.id})}">Editar</a></section></html>
