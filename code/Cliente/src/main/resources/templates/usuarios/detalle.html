<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml"
      th:replace="~{base :: layout('Detalle del usuario', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 th:attr="data-subtitle=${item.rol?.name() == 'ADMIN' ? 'Administrador del sistema' : 'Usuario del sistema'}">
    <span th:text="${item.apellido + ', ' + item.nombre}"></span></h3>
</section>
<section id="contenido">


  <div class="card">
    <div class="card-header d-flex align-items-center gap-2">
      <h3 class="card-title mb-0">Datos de la cuenta</h3>
      <span class="badge rounded-pill ms-auto"
            th:classappend="${item.rol == T(com.elvarest.cliente.dto.enums.Rol).ADMIN ? 'text-bg-primary' : 'text-bg-secondary'}"
            th:text="${item.rol == T(com.elvarest.cliente.dto.enums.Rol).ADMIN ? 'Administrador' : 'Usuario'}"></span>
    </div>
    <div class="card-body">
      <div class="alert alert-warning" role="status" th:if="${item.debeCambiarPassword}">
        <i class="bi bi-key me-2"></i>
        Este usuario tiene pendiente el cambio obligatorio de contraseña en su próximo inicio.
      </div>
      <div class="detail-grid">
        <div class="detail-item">
          <dt>Nombre de usuario</dt>
          <dd th:text="${item.nombreUsuario != null and !item.nombreUsuario.isBlank() ? item.nombreUsuario : '—'}"></dd>
        </div>
        <div class="detail-item">
          <dt>Correo electrónico</dt>
          <dd th:text="${item.correoElectronico != null and !item.correoElectronico.isBlank() ? item.correoElectronico : '—'}"></dd>
        </div>
        <div class="detail-item">
          <dt>Teléfono</dt>
          <dd th:text="${item.telefono != null and !item.telefono.isBlank() ? item.telefono : '—'}"></dd>
        </div>
        <div class="detail-item">
          <dt>Documento</dt>
          <dd th:text="${item.numeroDocumento != null and !item.numeroDocumento.isBlank() ? item.numeroDocumento : '—'}"></dd>
        </div>
        <div class="detail-item">
          <dt>Fecha de nacimiento</dt>
          <dd th:text="${item.fechaNacimiento != null ? #temporals.format(item.fechaNacimiento, 'dd/MM/yyyy') : '—'}"></dd>
        </div>
        <div class="detail-item">
          <dt>Rol</dt>
          <dd th:text="${item.rol != null ? item.rol : '—'}"></dd>
        </div>
      </div>
    </div>
  </div>

  <div class="list-toolbar">
    <div class="toolbar-filters">
      <a class="btn btn-outline-secondary" th:href="@{/usuarios/list}">
        <i class="bi bi-arrow-left me-1"></i>Volver al listado
      </a>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <form sec:authorize="hasRole('ADMIN')" method="post"
            th:action="@{/usuarios/{uuid}/restablecer-contrasena(uuid=${usuarioUuid})}"
            class="inline-action-form"
            data-confirm="La contraseña volverá a ser el nombre de usuario y se exigirá cambiarla en el próximo inicio. ¿Restablecer?">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-outline-warning" type="submit">
          <i class="bi bi-key me-1"></i>Restablecer contraseña
        </button>
      </form>
      <form method="post" th:action="@{/usuarios/baja/{uuid}(uuid=${usuarioUuid})}"
            class="inline-action-form"
            th:attr="data-confirm='¿Dar de baja al usuario ' + ${item.apellido + ', ' + item.nombre} + '?'">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-outline-danger" type="submit">
          <i class="bi bi-trash me-1"></i>Eliminar
        </button>
      </form>
      <a class="btn btn-primary" th:href="@{/usuarios/editar/{uuid}(uuid=${usuarioUuid})}">
        <i class="bi bi-pencil me-1"></i>Editar usuario
      </a>
    </div>
  </div>

</section>
</html>
