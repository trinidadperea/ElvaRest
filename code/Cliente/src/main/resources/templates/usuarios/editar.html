<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Editar usuario', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 th:attr="data-subtitle='Cuenta de ' + ${item.apellido + ', ' + item.nombre}">Editar usuario</h3>
</section>
<section id="contenido">


  <form method="post" th:action="@{/usuarios/actualizar}" th:object="${item}" data-loading>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
      <label for="nombre">Nombre</label>
      <input class="form-control" id="nombre" th:field="*{nombre}" required>
    </div>
    <div class="mb-3">
      <label for="apellido">Apellido</label>
      <input class="form-control" id="apellido" th:field="*{apellido}" required>
    </div>
    <div class="mb-3">
      <label for="fechaNacimiento">Fecha de nacimiento</label>
      <input class="form-control" id="fechaNacimiento" type="date" th:field="*{fechaNacimiento}" required>
    </div>
    <div class="mb-3">
      <label for="numeroDocumento">Documento</label>
      <input class="form-control" id="numeroDocumento" th:field="*{numeroDocumento}" required>
    </div>
    <div class="mb-3">
      <label for="telefono">Teléfono</label>
      <input class="form-control" id="telefono" th:field="*{telefono}" required>
    </div>
    <div class="mb-3">
      <label for="correoElectronico">Correo electrónico</label>
      <input class="form-control" id="correoElectronico" type="email" th:field="*{correoElectronico}" required>
    </div>
    <div class="mb-3">
      <label for="nombreUsuario">Nombre de usuario</label>
      <input class="form-control" id="nombreUsuario" th:field="*{nombreUsuario}" autocomplete="off" required>
    </div>
    <div class="mb-3">
      <label for="contrasena">Contraseña</label>
      <input class="form-control" id="contrasena" type="password" th:field="*{contraseña}"
             autocomplete="new-password" required>
      <div class="form-text">La contraseña se reemplaza al guardar: ingrese la contraseña deseada para esta cuenta.</div>
    </div>
    <div class="mb-3">
      <label for="rol">Rol</label>
      <select class="form-select" id="rol" th:field="*{rol}" required>
        <option th:each="value : ${T(com.elvarest.cliente.dto.enums.Rol).values()}"
                th:value="${value}" th:text="${value}"></option>
      </select>
      <div class="form-text">El rol Administrador habilita la gestión completa del sistema.</div>
    </div>

    <div class="d-flex flex-wrap gap-2 mt-3">
      <a class="btn btn-outline-secondary" th:href="@{/usuarios/{id}(id=${item.id})}">
        <i class="bi bi-arrow-left me-1"></i>Cancelar
      </a>
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-lg me-1"></i>Guardar cambios
      </button>
    </div>
  </form>

</section>
</html>
