<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Usuarios', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 data-subtitle="Cuentas con acceso al sistema">Usuarios</h3>
</section>
<section id="contenido">


  <div class="list-toolbar">
    <div class="toolbar-search">
      <input class="form-control" type="search" data-filter-input="#tablaUsuarios"
             placeholder="Buscar por nombre, usuario o correo…" aria-label="Buscar usuarios">
    </div>
    <div class="toolbar-filters">
      <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">
        <i class="bi bi-plus-lg me-1"></i>Nuevo usuario
      </a>
    </div>
  </div>

  <div class="table-responsive" th:if="${!items.isEmpty()}">
    <table class="table" id="tablaUsuarios">
      <thead>
      <tr>
        <th>Nombre</th>
        <th>Usuario</th>
        <th>Correo</th>
        <th>Rol</th>
        <th class="text-end">Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${items}">
        <td>
          <a class="fw-semibold text-decoration-none" th:href="@{/usuarios/{id}(id=${item.id})}"
             th:text="${item.apellido + ', ' + item.nombre}"></a>
        </td>
        <td th:text="${item.nombreUsuario != null and !item.nombreUsuario.isBlank() ? item.nombreUsuario : '—'}"></td>
        <td th:text="${item.correoElectronico != null and !item.correoElectronico.isBlank() ? item.correoElectronico : '—'}"></td>
        <td>
          <span class="badge rounded-pill"
                th:classappend="${item.rol == T(com.elvarest.cliente.dto.enums.Rol).ADMIN ? 'text-bg-primary' : 'text-bg-secondary'}"
                th:text="${item.rol == T(com.elvarest.cliente.dto.enums.Rol).ADMIN ? 'Administrador' : 'Usuario'}"></span>
        </td>
        <td>
          <div class="table-actions">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/{id}(id=${item.id})}">
              <i class="bi bi-eye"></i>Ver
            </a>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/usuarios/{id}/editar(id=${item.id})}">
              <i class="bi bi-pencil"></i>Editar
            </a>
            <a class="btn btn-sm btn-outline-danger" th:href="@{/usuarios/baja/{id}(id=${item.id})}"
               th:attr="data-confirm='¿Dar de baja al usuario ' + ${item.apellido + ', ' + item.nombre} + '?'">
              <i class="bi bi-trash"></i>Eliminar
            </a>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-state" th:if="${items.isEmpty()}">
    <i class="bi bi-person-gear"></i>
    <p class="empty-title">Sin usuarios registrados</p>
    <p>Cree la primera cuenta para que pueda acceder al sistema.</p>
    <a class="btn btn-primary mt-3" th:href="@{/usuarios/nuevo}">
      <i class="bi bi-plus-lg me-1"></i>Nuevo usuario
    </a>
  </div>

  <div class="empty-state d-none" data-filter-empty="tablaUsuarios" th:if="${!items.isEmpty()}">
    <i class="bi bi-search"></i>
    <p class="empty-title">Sin resultados</p>
    <p>Ningún usuario coincide con la búsqueda ingresada.</p>
  </div>

</section>
</html>
