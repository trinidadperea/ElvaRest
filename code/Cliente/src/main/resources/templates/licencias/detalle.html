<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Detalle de licencia', ~{::#encabezado}, ~{::#contenido})}">
<section id="encabezado"><h3>Detalle de licencia</h3></section><section id="contenido"><dl><dt>Tipo</dt><dd th:text="${item.tipo}"></dd><dt>Inicio</dt><dd th:text="${item.fechaInicio}"></dd><dt>Fin</dt><dd th:text="${item.fechaFin}"></dd><dt>Renovable</dt><dd th:text="${item.renovable}"></dd></dl><a class="btn btn-secondary" th:href="@{/licencias}">Volver</a><a class="btn btn-warning" th:href="@{/licencias/{id}/editar(id=${item.id})}">Editar</a></section></html>
