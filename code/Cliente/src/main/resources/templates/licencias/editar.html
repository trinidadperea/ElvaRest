<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Editar licencia', ~{::#encabezado}, ~{::#contenido}, '')}">
<section id="encabezado">
  <h3 th:attr="data-subtitle='Licencia: ' + ${item.tipo != null and !item.tipo.isBlank() ? item.tipo : 'sin tipo'}">Editar licencia</h3>
</section>
<section id="contenido">


  <form method="post" th:action="@{/licencias/actualizar}" th:object="${item}" data-loading>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
      <label for="tipo">Tipo de licencia</label>
      <input class="form-control" id="tipo" th:field="*{tipo}" required>
    </div>
    <div class="mb-3">
      <label for="fechaInicio">Fecha de inicio</label>
      <input class="form-control" id="fechaInicio" type="date" th:field="*{fechaInicio}" required>
    </div>
    <div class="mb-3">
      <label for="fechaFin">Fecha de fin</label>
      <input class="form-control" id="fechaFin" type="date" th:field="*{fechaFin}" required>
    </div>
    <div class="mb-3">
      <label class="form-check mb-0">
        <input class="form-check-input" type="checkbox" th:field="*{renovable}">
        Renovable
      </label>
      <div class="form-text">Indique si la licencia puede renovarse al finalizar su período.</div>
    </div>

    <div class="d-flex flex-wrap gap-2 mt-3">
      <a class="btn btn-outline-secondary" th:href="@{/licencias/{id}(id=${item.id})}">
        <i class="bi bi-arrow-left me-1"></i>Cancelar
      </a>
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-lg me-1"></i>Guardar cambios
      </button>
    </div>
  </form>

</section>
</html>
