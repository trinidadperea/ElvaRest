<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Dashboard', ~{::#encabezado}, ~{::#contenido})}">
<section id="encabezado">
<div class="row">
    <div class="col-sm-6">
        <h3 class="mb-0">Dashboard</h3>
    </div>
    <div class="col-sm-6">
        <ol class="breadcrumb float-sm-end">
            <li class="breadcrumb-item active">Inicio</li>
        </ol>
    </div>
</div>
</section>

<section id="contenido">

<div class="row">

    <div class="col-lg-3 col-6">
        <div class="small-box text-bg-primary">
            <div class="inner">
                <h3 th:text="${cantidadDocentes}">0</h3>
                <p>Docentes</p>
            </div>
            <div class="small-box-icon">
                <i class="bi bi-person-badge"></i>
            </div>
        </div>
    </div>

    <div class="col-lg-3 col-6">
        <div class="small-box text-bg-success">
            <div class="inner">
                <h3 th:text="${cantidadAlertas}">0</h3>
                <p>Alertas</p>
            </div>
            <div class="small-box-icon">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
        </div>
    </div>

    <div class="col-lg-3 col-6">
        <div class="small-box text-bg-warning">
            <div class="inner">
                <h3 th:text="${cantidadConcursos}">0</h3>
                <p>Concursos</p>
            </div>
            <div class="small-box-icon">
                <i class="bi bi-trophy"></i>
            </div>
        </div>
    </div>

    <div class="col-lg-3 col-6">
        <div class="small-box text-bg-danger">
            <div class="inner">
                <h3 th:text="${cantidadCargos}">0</h3>
                <p>Cargos</p>
            </div>
            <div class="small-box-icon">
                <i class="bi bi-briefcase"></i>
            </div>
        </div>
    </div>

</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title">Bienvenido</h3>
    </div>

    <div class="card-body">
        Bienvenido al sistema <strong>ElvaRest</strong>,
        <span th:text="${#authentication != null ? #authentication.name : 'Usuario'}">Usuario</span>.
    </div>
</div>

</section>
</html>
