<aside class="app-sidebar" data-bs-theme="light" th:fragment="sidebar" xmlns:sec="http://www.w3.org/1999/xhtml">
    <div class="sidebar-brand">
        <a th:href="@{/}" class="brand-link">
            <img th:src="@{/adminlte/img/AdminLTELogo.png}" alt="Gestión de Concursos Docentes" class="brand-image opacity-75 shadow">
            <span class="brand-text">
        <span class="brand-title">SGD</span>
        <small>Gestión institucional</small>
      </span>
        </a>
    </div>

    <div class="sidebar-wrapper">
        <nav class="mt-2" aria-label="Menú principal">
            <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" data-accordion="false" id="navigation">

                <li class="nav-header">INSTITUCIÓN</li>
                <li class="nav-item">
                    <a th:href="@{/}" class="nav-link"
                       th:classappend="${currentPath == '/' ? 'active' : ''}">
                        <i class="nav-icon bi bi-speedometer"></i>
                        <p>Dashboard</p>
                    </a>
                </li>

                <li class="nav-header">GESTIÓN ACADÉMICA</li>
                <li class="nav-item">
                    <a th:href="@{/docentes}" class="nav-link"
                       th:classappend="${#strings.startsWith(currentPath, '/docentes') ? 'active' : ''}">
                        <i class="nav-icon bi bi-person-badge"></i>
                        <p>Docentes</p>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/cargos}" class="nav-link"
                       th:classappend="${#strings.startsWith(currentPath, '/cargos') or #strings.startsWith(currentPath, '/designaciones') ? 'active' : ''}">
                        <i class="nav-icon bi bi-briefcase"></i>
                        <p>Cargos</p>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/concursos}" class="nav-link"
                       th:classappend="${#strings.startsWith(currentPath, '/concursos') ? 'active' : ''}">
                        <i class="nav-icon bi bi-trophy"></i>
                        <p>Concursos</p>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/alertas}" class="nav-link"
                       th:classappend="${#strings.startsWith(currentPath, '/alertas') ? 'active' : ''}">
                        <i class="nav-icon bi bi-exclamation-triangle"></i>
                        <p>Alertas</p>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/reportes}" class="nav-link"
                       th:classappend="${#strings.startsWith(currentPath, '/reportes') ? 'active' : ''}">
                        <i class="nav-icon bi bi-bar-chart"></i>
                        <p>Reportes</p>
                    </a>
                </li>

                <li class="nav-header">MATERIA/CURSO</li>
                <li class="nav-item">
                    <a th:href="@{/materias}" class="nav-link"
                       th:classappend="${#strings.startsWith(currentPath, '/materias') ? 'active' : ''}">
                        <i class="nav-icon bi bi-book"></i>
                        <p>Materias</p>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/academica}" class="nav-link"
                       th:classappend="${#strings.startsWith(currentPath, '/academica') ? 'active' : ''}">
                        <i class="nav-icon bi bi-mortarboard"></i>
                        <p>Cursos</p>
                    </a>
                </li>

                <li class="nav-header">SISTEMA</li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/usuarios}" class="nav-link"
                       th:classappend="${#strings.startsWith(currentPath, '/usuarios') ? 'active' : ''}">
                        <i class="nav-icon bi bi-person-gear"></i>
                        <p>Usuarios</p>
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/tipos-certificado}" class="nav-link"
                       th:classappend="${#strings.startsWith(currentPath, '/tipos-certificado') ? 'active' : ''}">
                        <i class="nav-icon bi bi-file-earmark-medical"></i>
                        <p>Tipos de certificado</p>
                    </a>
                </li>

            </ul>
        </nav>
    </div>
</aside>
