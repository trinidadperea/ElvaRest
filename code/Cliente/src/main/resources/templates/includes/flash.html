<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Mensajes globales de éxito / error / información (flash attributes) -->
<div th:fragment="flash" class="app-flash">
  <div th:if="${msgExito}" class="alert alert-success alert-dismissible fade show" role="status">
    <i class="bi bi-check-circle-fill me-2" aria-hidden="true"></i>
    <span th:text="${msgExito}">Operación realizada correctamente.</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
  <div th:if="${msgError}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>
    <span th:text="${msgError}">Ocurrió un error.</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
  <div th:if="${msgInfo}" class="alert alert-info alert-dismissible fade show" role="status">
    <i class="bi bi-info-circle-fill me-2" aria-hidden="true"></i>
    <span th:text="${msgInfo}">Información.</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
</div>
</body>
</html>
