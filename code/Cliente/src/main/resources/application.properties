spring.application.name=Cliente
server.port=8090

#Para que no intente crear la BD
spring.main.web-application-type=servlet
spring.datasource.initialize=false
spring.jpa.hibernate.ddl-auto=none
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# Sesión: se cierra tras 10 minutos sin actividad (se renueva con cada uso) y se vuelve a pedir el login.
server.servlet.session.timeout=10m

spring.mvc.log-request-details=true
logging.level.org.springframework.web=DEBUG

# Credenciales de acceso al frontend. Configurarlas como variables de entorno.
spring.security.user.name=${LOGIN_USER}
spring.security.user.password=${LOGIN_PASSWORD}

#seguridad para el acceso a la API.
api.user=${API_USER}
api.password=${API_PASSWORD}