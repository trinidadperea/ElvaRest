{% extends "base.html" %}

{% block title %}Editar certificado{% endblock %}



{% block content_header %}

<div class="row">


    <div class="col-sm-6">


        <h3 class="mb-0">


            <i class="bi bi-pencil-square me-2"></i>


            Editar certificado



        </h3>


    </div>





    <div class="col-sm-6">


        <ol class="breadcrumb float-sm-end">


            <li class="breadcrumb-item">

                <a href="{% url 'core:index' %}">
                    Inicio
                </a>

            </li>




            <li class="breadcrumb-item">

                <a href="{% url 'certificados:lista' %}">
                    Certificados
                </a>

            </li>




            <li class="breadcrumb-item active">

                Editar

            </li>




        </ol>


    </div>


</div>


{% endblock %}









{% block content %}







<div class="row">



    <div class="col-md-8">





        <div class="card">





            <div class="card-header">


                <h5 class="mb-0">


                    <i class="bi bi-file-earmark-text me-2"></i>


                    Editar certificado



                </h5>



            </div>







            <div class="card-body">





                <form>






                    <!-- Alumno -->

                    <div class="mb-3">


                        <label class="form-label">


                            Alumno


                        </label>




                        <select class="form-select">


                            <option selected>


                                Juan Pérez


                            </option>


                            <option>


                                María González


                            </option>


                            <option>


                                Carlos Rodríguez


                            </option>



                        </select>



                    </div>









                    <!-- Tipo -->

                    <div class="mb-3">


                        <label class="form-label">


                            Tipo de certificado


                        </label>




                        <select class="form-select">


                            <option selected>


                                Certificado de alumno regular


                            </option>


                            <option>


                                Certificado de estudios


                            </option>


                            <option>


                                Certificado de asistencia


                            </option>



                        </select>



                    </div>









                    <!-- Estado -->

                    <div class="mb-3">


                        <label class="form-label">


                            Estado


                        </label>




                        <select class="form-select">


                            <option selected>


                                Generado


                            </option>


                            <option>


                                Pendiente


                            </option>



                        </select>



                    </div>









                    <!-- Observaciones -->

                    <div class="mb-3">


                        <label class="form-label">


                            Observaciones


                        </label>




                        <textarea 
                            class="form-control"
                            rows="4"
                        >Certificado generado correctamente.</textarea>



                    </div>









                    <div class="d-flex justify-content-between">





                        <a 
                            href="{% url 'certificados:lista' %}" 
                            class="btn btn-secondary"
                        >


                            <i class="bi bi-arrow-left"></i>


                            Cancelar



                        </a>







                        <button 
                            type="submit"
                            class="btn btn-primary"
                        >


                            <i class="bi bi-save"></i>


                            Guardar cambios



                        </button>






                    </div>








                </form>






            </div>







        </div>







    </div>





</div>








{% endblock %}
